<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - VendaCarros</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html"><img src="logo.png" alt="VendaCarros" class="logo"></a>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="login.html">Entrar</a></li>
            <li><a href="cadastro.html">Cadastrar</a></li>
        </ul>
    </nav>
    <main>
        <div class="form-container">
            <h2>Criar conta</h2>
            <p id="mensagem-cadastro" class="mensagem-form"></p>
            <form id="form-cadastro">
                <div class="form-grupo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-grupo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="form-grupo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-grupo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" autocomplete="off" required>
                </div>
                <div class="form-grupo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>
                <button type="submit" class="btn-primario">Cadastrar</button>
            </form>
            <p class="form-link">Já tem conta? <a href="login.html">Entrar</a></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 VendaCarros. Todos os direitos reservados.</p>
    </footer>
    <script>
        const form = document.getElementById('form-cadastro');
        const mensagem = document.getElementById('mensagem-cadastro');

        function soDigitos(valor) {
            return valor.replace(/\D/g, '');
        }

        form.addEventListener('submit', evento => {
            evento.preventDefault();
            mensagem.textContent = '';

            const cpf = soDigitos(document.getElementById('cpf').value);
            const telefone = soDigitos(document.getElementById('telefone').value);
            const senha = document.getElementById('senha').value;

            // if (!document.getElementById('email').value.includes('@')) {
            //     alert('Informe um e-mail valido.');
            //     return;
            // }

            if (cpf.length !== 11) {
                mensagem.textContent = 'Informe um CPF válido (11 dígitos).';
                return;
            }
            if (telefone.length < 10) {
                mensagem.textContent = 'Informe um telefone válido com DDD.';
                return;
            }
            if (senha.length < 4) {
                mensagem.textContent = 'A senha deve ter pelo menos 4 caracteres.';
                return;
            }

            fetch('controlador-publico.php?acao=cadastrar', {
                method: 'POST',
                body: new FormData(form),
            })
                .then(resposta => resposta.json())
                .then(dados => {
                    if (dados.ok) {
                        window.location.href = 'login.html?cadastro=ok';
                    } else {
                        mensagem.textContent = dados.erro;
                    }
                })
                .catch(() => {
                    mensagem.textContent = 'Erro ao enviar o cadastro. Tente novamente.';
                });
        });
    </script>
</body>
</html>
